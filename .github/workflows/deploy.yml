name: Publier Le QG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests
        run: npm test
      - name: Génération de la configuration
        run: npm run config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Préparation du site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest css js icons _site/
          rm -f _site/icons/source.png
          # Numéro de version sur chaque fichier : les téléphones chargent toujours la dernière version
          V=${GITHUB_SHA::8}
          sed -i -E "s#(href|src)=\"(css/styles\.css|js/config\.js|js/app\.js|manifest\.webmanifest)\"#\1=\"\2?v=$V\"#g" _site/index.html
          sed -i -E "s#from '\./([a-z]+)\.js'#from './\1.js?v=$V'#g" _site/js/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
