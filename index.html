<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5c1427">
  <meta name="description" content="Le QG — le quotidien du foyer d’Ilona et Adrien : tâches, répartition, menus, courses et inventaire.">
  <title>Le QG</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Le QG">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"></div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <div class="sheet-header">
        <span class="sheet-grip" aria-hidden="true"></span>
        <h2 id="sheet-title"></h2>
        <button class="icon-btn" data-act="close-sheet" aria-label="Fermer">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </dialog>

  <dialog id="confirm" class="confirm" aria-labelledby="confirm-text">
    <p id="confirm-text"></p>
    <p id="confirm-detail" class="muted small"></p>
    <div class="sheet-actions">
      <button id="confirm-cancel" class="btn ghost">Annuler</button>
      <button id="confirm-ok" class="btn danger">Supprimer</button>
    </div>
  </dialog>

  <datalist id="units">
    <option value="g"><option value="kg"><option value="ml"><option value="cl"><option value="l">
    <option value="pièces"><option value="boîte"><option value="sachet"><option value="paquet"><option value="bouteille">
    <option value="pot"><option value="c. à soupe"><option value="c. à café"><option value="tranches"><option value="gousses">
  </datalist>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>Le QG a besoin de JavaScript pour fonctionner.</noscript>
</body>
</html>
